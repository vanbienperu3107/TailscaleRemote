# Caddyfile snippet cho vpn6 — thêm vào Caddyfile hệ thống hiện có của vpn6.
#
# Mục đích: Route traffic từ domain HA (vpn2.hangocthanh.io.vn) sang
# control plane containers chạy trên localhost:18xxx (publish bởi docker-compose).
#
# Cách dùng:
#   1. Thêm import snippet này vào Caddyfile chính của vpn6:
#      import /opt/tailscale-remote/deploy/vpn6/caddy-snippet.conf
#
#   2. Hoặc copy nội dung block dưới vào Caddyfile hiện có.
#
# Cloudflare LB sẽ route vpn2.hangocthanh.io.vn → vpn2 VÀ vpn6.
# Caddy trên vpn6 phải serve cùng domain → snippet này đảm nhiệm việc đó.
#
# Lưu ý: vpn6.hangocthanh.io.vn (DERP relay) vẫn hoạt động bình thường,
# không bị ảnh hưởng bởi snippet này.

vpn2.hangocthanh.io.vn {
  log { output stdout; format json }

  # ── DERP Relay — route đến derp-controller trên vpn6 ─────────────────────
  # BUG NOTE: /derp* phải đến relay binary, không phải control plane.
  # Nhưng vpn6 không chạy derp-relay standalone trong control plane stack.
  # Để client dùng DERP relay qua vpn6, họ kết nối vpn6.hangocthanh.io.vn (relay).
  # /derp* trên vpn2.hangocthanh.io.vn (HA domain) → fallback derp-controller
  # sẽ trả 404 vì derp disabled — client sẽ dùng relay node khác trong DERPMap.
  handle /derp*          { reverse_proxy 127.0.0.1:18081 }

  # ── Control plane ─────────────────────────────────────────────────────────
  handle /key            { reverse_proxy 127.0.0.1:18081 }
  handle /ts2021         { reverse_proxy 127.0.0.1:18081 }
  handle /register/*     { reverse_proxy 127.0.0.1:18081 }
  handle /machine/*      { reverse_proxy 127.0.0.1:18081 }
  handle /api/v1/*       { reverse_proxy 127.0.0.1:18081 }
  handle /noise          { reverse_proxy 127.0.0.1:18081 }
  handle /generate_204   { respond 204 }

  # ── Admin-UI và Api-center ────────────────────────────────────────────────
  handle /app/api/*      { reverse_proxy 127.0.0.1:18787 }
  handle /app/*          { reverse_proxy 127.0.0.1:18080 }

  # ── Health check (Cloudflare LB dùng endpoint này) ────────────────────────
  handle /healthz        { reverse_proxy 127.0.0.1:18787 }

  # ── Redirect root ─────────────────────────────────────────────────────────
  @root path /
  handle @root { redir * /app/ 302 }

  # ── Fallback → control plane ──────────────────────────────────────────────
  handle { reverse_proxy 127.0.0.1:18081 }
}
