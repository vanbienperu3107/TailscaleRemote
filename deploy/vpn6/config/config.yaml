# Config headscale cho vpn6 — GIỐNG HỆT vpn2 trừ phần listen_addr.
# Cả 2 instance (vpn2 và vpn6) phải dùng cùng server_url và database.

# === Server ===
server_url: https://vpn2.hangocthanh.io.vn
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false

noise:
  private_key_path: /etc/headscale-keys/noise_private.key

# === IP Allocation ===
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# === DERP ===
derp:
  server:
    enabled: false
    automatically_add_embedded_derp_region: false
  paths: []
  urls:
    - http://api-center:8787/derpmap.json
  auto_update_enabled: true
  update_frequency: 10s
  dashboard:
    enabled: true
    url: http://api-center:8787
    timeout_ms: 500

# === Node ===
node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m
  routes:
    ha:
      probe_interval: 10s
      probe_timeout: 5s

# === Database (Postgres — chia sẻ giữa vpn2 và vpn6) ===
database:
  type: postgres
  postgres:
    host: placeholder_overridden_by_env
    port: 5432
    name: placeholder_overridden_by_env
    user: placeholder_overridden_by_env
    pass: placeholder_overridden_by_env
    ssl: true
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_idle_time_secs: 3600

# === DNS ===
dns:
  magic_dns: true
  base_domain: tail.hangocthanh.io.vn
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 8.8.8.8
    split: {}
  search_domains: []
  extra_records: []

# === ACL Policy ===
policy:
  mode: file
  path: /etc/headscale/acl.json

# === OIDC ===
oidc:
  only_start_if_oidc_is_available: false
  issuer: "https://accounts.google.com"
  scope: ["openid", "profile", "email"]
  pkce:
    enabled: true
    method: S256
  allowed_users:
    - hangocthanh3107@gmail.com
    - hangocthanhperu3107@gmail.com

# === Logging ===
log:
  level: info
  format: text

logtail:
  enabled: false

disable_check_updates: true
randomize_client_port: false

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
