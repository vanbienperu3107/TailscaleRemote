services:

  # ─── DERP-Controller (control plane — HA với vpn6) ───────────────────────────
  # HA: cùng Neon Postgres DB + cùng noise_private.key với instance trên vpn6.
  # Postgres credentials đọc từ HEADSCALE_DATABASE_POSTGRES_* env vars (viper).
  # noise_private.key mount từ ./headscale-keys/ (ghi bởi deploy workflow từ secret).
  derp-controller:
    image: ghcr.io/vanbienperu3107/headscale:0.27.1-pernode
    container_name: derp-controller
    restart: unless-stopped
    command: serve
    depends_on:
      api-center:
        condition: service_healthy
    environment:
      - HEADSCALE_OIDC_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - HEADSCALE_OIDC_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - HEADSCALE_DERP_DASHBOARD_SECRET=${HEADSCALE_DASHBOARD_SECRET}
      # Postgres — headscale đọc HEADSCALE_DATABASE_POSTGRES_* qua viper auto-env
      - HEADSCALE_DATABASE_POSTGRES_HOST=${HS_DB_HOST}
      - HEADSCALE_DATABASE_POSTGRES_PORT=${HS_DB_PORT:-5432}
      - HEADSCALE_DATABASE_POSTGRES_NAME=${HS_DB_NAME}
      - HEADSCALE_DATABASE_POSTGRES_USER=${HS_DB_USER}
      - HEADSCALE_DATABASE_POSTGRES_PASS=${HS_DB_PASS}
      - HEADSCALE_DATABASE_POSTGRES_SSL=${HS_DB_SSL:-true}
    volumes:
      - ./config:/etc/headscale:ro
      # noise_private.key mount riêng — PHẢI giống hệt key trên vpn6.
      # Deploy workflow ghi từ secret HEADSCALE_NOISE_KEY vào ./headscale-keys/
      - ./headscale-keys:/etc/headscale-keys:ro
      - derp_controller_run:/var/run/headscale
    ports:
      - "3478:3478/udp"   # STUN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1

  # ─── Api-center (hub API trung tâm — HA với vpn6) ────────────────────────────
  # Sessions lưu Neon Postgres → stateless, cả 2 instance đọc được session nhau.
  api-center:
    image: ghcr.io/vanbienperu3107/api-center:latest
    container_name: api-center
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=8787
      - PUBLIC_URL=${PUBLIC_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS}
      - HEADSCALE_API_KEY=${HEADSCALE_API_KEY}
      - HEADSCALE_API_URL=${HEADSCALE_API_URL:-http://derp-controller:8080}
      - HEADSCALE_DASHBOARD_SECRET=${HEADSCALE_DASHBOARD_SECRET}
      - AUTH_OPTIONAL=false
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/healthz 2>/dev/null | grep -q ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  # ─── Admin-UI (static — HA với vpn6, zero state) ─────────────────────────────
  admin-ui:
    image: ghcr.io/vanbienperu3107/admin-ui:latest
    container_name: admin-ui
    restart: unless-stopped

  # ─── DERP Relay vpn2 (standalone — chỉ relay, không phải control plane) ──────
  # STUN port vpn2 relay = 3479 (3478 đã dùng bởi STUN của control plane).
  # Khi thêm vpn2 vào derpServers qua Admin-UI, đặt stun_port=3479.
  derp-relay:
    image: ghcr.io/vanbienperu3107/derp-relay:latest
    container_name: derp-relay
    restart: unless-stopped
    environment:
      - DERP_HOSTNAME=${DOMAIN:-vpn2.hangocthanh.io.vn}
      - DERP_CERTMODE=manual
      - DERP_CERTDIR=/certs
      - DERP_HTTP_PORT=8080
      - DERP_VERIFY_CLIENTS=true
      - REPORTER_NAME=
    volumes:
      - derp_relay_certs:/certs
    ports:
      - "3479:3478/udp"   # STUN relay

  # ─── Latency + Collector Sidecar ─────────────────────────────────────────────
  # COUPLING: hai service này PHẢI chạy cùng host (chia sẻ ts_sock Unix socket).
  # Nếu di chuyển, di chuyển cả 2 cùng lúc.
  latency:
    image: ghcr.io/vanbienperu3107/latency:latest
    container_name: latency
    restart: unless-stopped
    environment:
      - HS_API_URL=${HS_API_URL:-http://derp-controller:8080}
      - HS_API_KEY=${HEADSCALE_API_KEY}
      - API_CENTER_URL=http://api-center:8787
      - POLL_INTERVAL=30
      - DRY_RUN=${DEDUP_DRY_RUN:-false}
      - AUTO_APPROVE_ROUTES=${AUTO_APPROVE_ROUTES:-true}
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - SRC_NAME=collector
    volumes:
      - ts_sock:/var/run/tailscale
    depends_on:
      derp-controller:
        condition: service_started
      api-center:
        condition: service_healthy

  collector-sidecar:
    image: ghcr.io/vanbienperu3107/collector-sidecar:latest
    container_name: collector-sidecar
    hostname: collector
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      # socat: port 8090 (tailnet) → api-center:8787 (Docker internal)
      - FORWARD_TARGET=api-center:8787
      - FORWARD_PORT=8090
    volumes:
      - collector_state:/var/lib/tailscale
      - ts_sock:/var/run/tailscale
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    depends_on:
      derp-controller:
        condition: service_started
      api-center:
        condition: service_healthy

  # ─── Gateway (TLS termination) ────────────────────────────────────────────────
  # Chỉ chạy trên vpn2 — vpn6 dùng Caddy sẵn có.
  # DOMAIN env var dùng cho Caddyfile {$DOMAIN} placeholder.
  gateway:
    image: ghcr.io/vanbienperu3107/gateway:latest
    container_name: gateway
    restart: unless-stopped
    depends_on:
      - derp-controller
      - api-center
      - admin-ui
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-vpn2.hangocthanh.io.vn}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway_data:/data
      - gateway_config:/config

volumes:
  derp_relay_certs:
  collector_state:
  ts_sock:
  derp_controller_run:
  gateway_data:
  gateway_config:
