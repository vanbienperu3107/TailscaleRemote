services:

  # ─── DERP-Controller (control plane thuần — không còn embedded relay) ───────
  derp-controller:
    image: ghcr.io/vanbienperu3107/headscale:0.27.1-pernode
    container_name: derp-controller
    restart: unless-stopped
    command: serve
    depends_on:
      api-center:
        condition: service_healthy
    environment:
      - HEADSCALE_OIDC_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - HEADSCALE_OIDC_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - HEADSCALE_DERP_DASHBOARD_SECRET=${HEADSCALE_DASHBOARD_SECRET}
    volumes:
      - ./config:/etc/headscale
      - derp_controller_data:/var/lib/headscale
      - derp_controller_run:/var/run/headscale
    ports:
      - "3478:3478/udp"   # STUN — headscale tự handle cho client discovery
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1

  # ─── Api-center (hub API trung tâm) ──────────────────────────────────────────
  # PORTABILITY: PUBLIC_URL, HEADSCALE_API_URL lấy từ .env để dễ di chuyển.
  # Cùng host: HEADSCALE_API_URL=http://derp-controller:8080 (Docker DNS).
  # Khác host: HEADSCALE_API_URL=https://<domain-của-derp-controller>.
  api-center:
    image: ghcr.io/vanbienperu3107/api-center:latest
    container_name: api-center
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=8787
      - PUBLIC_URL=${PUBLIC_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS}
      - HEADSCALE_API_KEY=${HEADSCALE_API_KEY}
      - HEADSCALE_API_URL=${HEADSCALE_API_URL:-http://derp-controller:8080}
      - HEADSCALE_DASHBOARD_SECRET=${HEADSCALE_DASHBOARD_SECRET}
      - AUTH_OPTIONAL=false
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/healthz 2>/dev/null | grep -q ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  # ─── Admin-UI (giao diện admin thuần tĩnh) ───────────────────────────────────
  admin-ui:
    image: ghcr.io/vanbienperu3107/admin-ui:latest
    container_name: admin-ui
    restart: unless-stopped

  # ─── DERP Relay vpn2 (relay độc lập — cùng image với vpn3/4/6) ───────────────
  # Chạy sau Caddy: DERP_CERTMODE=manual + DERP_HTTP_PORT=8080 → serve HTTP plain.
  # Caddy terminate TLS và reverse_proxy /derp* → derp-relay:8080.
  # STUN port vpn2 relay: 3479 (3478 đã dùng bởi DERP-Controller STUN).
  # → Khi thêm vpn2 relay vào Admin-UI, đặt stun_port=3479.
  derp-relay:
    image: ghcr.io/vanbienperu3107/derp-relay:latest
    container_name: derp-relay
    restart: unless-stopped
    environment:
      - DERP_HOSTNAME=${DOMAIN:-vpn2.hangocthanh.io.vn}
      - DERP_CERTMODE=manual
      - DERP_CERTDIR=/certs
      - DERP_HTTP_PORT=8080
      - DERP_VERIFY_CLIENTS=true
      # REPORTER_NAME= để trống: vpn2 relay không chạy ping-reporter
      # (latency module đã đảm nhiệm việc ping từ vpn2)
      - REPORTER_NAME=
    volumes:
      - derp_relay_certs:/certs
    ports:
      - "3479:3478/udp"   # STUN relay — khác port với derp-controller STUN (3478)

  # ─── Latency (thu thập + tổng hợp latency) ───────────────────────────────────
  # PORTABILITY: HS_API_URL lấy từ .env.
  # Cùng host: HS_API_URL=http://derp-controller:8080 (Docker DNS).
  # Khác host: HS_API_URL=https://<domain-của-derp-controller>.
  #
  # COUPLING: latency + collector-sidecar PHẢI chạy cùng host vì dùng chung
  # Unix socket tailscale qua volume ts_sock. Nếu di chuyển, di chuyển cả 2 cùng lúc.
  latency:
    image: ghcr.io/vanbienperu3107/latency:latest
    container_name: latency
    restart: unless-stopped
    environment:
      - HS_API_URL=${HS_API_URL:-http://derp-controller:8080}
      - HS_API_KEY=${HEADSCALE_API_KEY}
      - POLL_INTERVAL=30
      - DB_PATH=/data/devices.db
      - DRY_RUN=${DEDUP_DRY_RUN:-false}
      - AUTO_APPROVE_ROUTES=${AUTO_APPROVE_ROUTES:-true}
      - METRICS_PORT=8090
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      # DERP_PROBE_URLS: override nếu thêm/bỏ relay node.
      # Default trong Python: vpn2/vpn3/vpn4/vpn5/vpn6 URLs.
      - DERP_PROBE_URLS=${DERP_PROBE_URLS:-}
    volumes:
      - latency_data:/data
      - ts_sock:/var/run/tailscale
    depends_on:
      - derp-controller

  # ─── Collector Sidecar (tailscale + socat) ───────────────────────────────────
  # PORTABILITY: TS_EXTRA_ARGS lấy từ .env (chứa --login-server URL).
  # Nếu DERP-Controller đổi domain, cập nhật TS_EXTRA_ARGS trong .env.
  #
  # COUPLING: phải chạy cùng host với latency (chia sẻ ts_sock volume).
  collector-sidecar:
    image: ghcr.io/vanbienperu3107/collector-sidecar:latest
    container_name: collector-sidecar
    hostname: collector
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - FORWARD_TARGET=latency:8090
      - FORWARD_PORT=8090
    volumes:
      - collector_state:/var/lib/tailscale
      - ts_sock:/var/run/tailscale
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    depends_on:
      - derp-controller
      - latency

  # ─── Gateway (TLS termination + routing) ─────────────────────────────────────
  # PORTABILITY: dùng image từ GHCR thay vì build tại chỗ.
  # CI/CD module-gateway.yml tự build và push khi modules/gateway/** thay đổi.
  # Caddyfile mount từ ./Caddyfile; domain đọc từ env var DOMAIN.
  gateway:
    image: ghcr.io/vanbienperu3107/gateway:latest
    container_name: gateway
    restart: unless-stopped
    depends_on:
      - derp-controller
      - api-center
      - admin-ui
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-vpn2.hangocthanh.io.vn}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway_data:/data
      - gateway_config:/config

volumes:
  derp_controller_data:
  derp_controller_run:
  derp_relay_certs:
  latency_data:
  collector_state:
  ts_sock:
  gateway_data:
  gateway_config:
