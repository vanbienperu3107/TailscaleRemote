services:

  # ─── Proxy Node ───────────────────────────────────────────────────────────────
  # Module hoàn toàn độc lập — deploy trên BẤT KỲ VPS nào:
  #
  #   cp .env.example .env && vim .env
  #   docker compose up -d
  #
  # Cách hoạt động:
  #   1. Container join tailnet như 1 client thường (không ảnh hưởng node khác)
  #   2. Chạy SOCKS5 proxy (:1080) + HTTP proxy (:8118)
  #   3. Thành viên set proxy → <tailscale-ip-của-node>:1080
  #   4. Traffic đi qua internet connection của VPS này
  #
  # Không cần /dev/net/tun hay NET_ADMIN — chạy ở chế độ userspace-networking.
  # Hoạt động trên cả KVM, OpenVZ và các VPS không hỗ trợ kernel tun.
  proxy-node:
    image: ghcr.io/vanbienperu3107/exit-node:latest
    container_name: proxy-node
    restart: unless-stopped
    hostname: ${EXIT_NODE_HOSTNAME:-proxy-node}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - EXIT_NODE_HOSTNAME=${EXIT_NODE_HOSTNAME:-proxy-node}
      - TS_LOGIN_SERVER=${TS_LOGIN_SERVER}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - ADVERTISE_EXIT_NODE=${ADVERTISE_EXIT_NODE:-false}
    ports:
      # SOCKS5 — thành viên set: socks5://<ts-ip>:1080 (hoặc SOCKS5_PORT)
      - "${SOCKS5_BIND:-0.0.0.0}:${SOCKS5_PORT:-1080}:1080"
      # HTTP CONNECT proxy — thành viên set: http://<ts-ip>:8118
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8118}:8118"
    volumes:
      - proxy_node_state:/var/lib/tailscale

volumes:
  proxy_node_state:
