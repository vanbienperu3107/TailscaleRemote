name: 'Module: derp-controller'

on:
  push:
    branches: [main]
    paths:
      - 'modules/derp-controller/**'
  pull_request:
    paths:
      - 'modules/derp-controller/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/derp-controller
  IMAGE_ALIAS: ghcr.io/${{ github.repository_owner }}/headscale
  MODULE: modules/derp-controller

jobs:
  build:
    name: Build derp-controller image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.MODULE }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE_ALIAS }}:0.27.1-pernode
            ${{ env.IMAGE_ALIAS }}:latest-pernode
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=0.27.1-pernode

  deploy:
    name: Deploy derp-controller to vpn2+vpn6
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    environment: production
    steps:
      - name: Deploy to vpn2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPN2_HOST }}
          username: ${{ secrets.VPN2_USER }}
          key: ${{ secrets.VPN2_SSH_KEY }}
          script: |
            cd /opt/tailscale-remote/deploy/vpn2
            docker compose pull derp-controller
            docker compose up -d --no-deps derp-controller
            echo "derp-controller deployed OK on vpn2"

      - name: Deploy to vpn6
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPN6_HOST }}
          username: ${{ secrets.VPN6_USER }}
          key: ${{ secrets.VPN6_SSH_KEY }}
          script: |
            cd /opt/tailscale-remote/deploy/vpn6
            docker compose pull derp-controller
            docker compose up -d --no-deps derp-controller
            echo "derp-controller deployed OK on vpn6"
