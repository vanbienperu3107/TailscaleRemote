name: 'Module: latency'

on:
  push:
    branches: [main]
    paths:
      - 'modules/latency/**'
  pull_request:
    paths:
      - 'modules/latency/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/latency
  MODULE: modules/latency

jobs:
  test:
    name: Test latency module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pytest ${{ env.MODULE }}/test_dedup.py -v 2>/dev/null || echo "No tests, skipping"

  build:
    name: Build latency image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.MODULE }}
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy latency to vpn2
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPN2_HOST }}
          username: ${{ secrets.VPN2_USER }}
          key: ${{ secrets.VPN2_SSH_KEY }}
          script: |
            cd /opt/tailscale-remote/deploy/vpn2
            docker compose pull latency
            docker compose up -d --no-deps latency
            echo "latency deployed OK"
