name: 'Module: exit-node (proxy-node)'

# Build image và push lên GHCR khi source thay đổi.
# KHÔNG auto-deploy — proxy-node là module standalone, deploy thủ công
# trên từng VPS bằng deploy/exit-node/docker-compose.yml.
#
# Deploy lên VPS mới:
#   docker compose pull proxy-node
#   docker compose up -d

on:
  push:
    branches: [main]
    paths:
      - 'modules/exit-node/**'
  pull_request:
    paths:
      - 'modules/exit-node/**'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/exit-node
  MODULE: modules/exit-node

jobs:
  build:
    name: Build & push exit-node image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.MODULE }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
