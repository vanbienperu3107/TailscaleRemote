name: 'Module: derp-relay'

on:
  push:
    branches: [main]
    paths:
      - 'modules/derp-relay/**'
      - 'contracts/**'
  pull_request:
    paths:
      - 'modules/derp-relay/**'
      - 'contracts/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/derp-relay
  MODULE: modules/derp-relay

jobs:
  # ── 1. Test reporter ──────────────────────────────────────────────────────────
  test:
    name: Test ping-reporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest && python -m pytest ${{ env.MODULE }}/test_reporter.py -v

  # ── 2. Contract check — metrics/report schema ─────────────────────────────────
  contract-check:
    name: Check metrics/report contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify reporter payload matches contract
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^contracts/api-center"; then
            echo "::warning::api-center contract changed — verify reporter.py POST /metrics/report payload still matches"
          fi
          # Check reporter.py sends required fields
          grep -q '"hostname"' ${{ env.MODULE }}/reporter.py || (echo "::error::reporter.py missing 'hostname' field" && exit 1)
          grep -q '"samples"' ${{ env.MODULE }}/reporter.py || (echo "::error::reporter.py missing 'samples' field" && exit 1)
          echo "Reporter payload fields OK"

  # ── 3. Build image ────────────────────────────────────────────────────────────
  build:
    name: Build derp-relay image
    runs-on: ubuntu-latest
    needs: [test, contract-check]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.MODULE }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}

  # ── 4. Khám phá danh sách relay node QUA API (nguồn duy nhất là DB) ───────────
  # Không còn hardcode tập vpn3/vpn4/vpn6. Đọc /derpmap.json của api-center — endpoint
  # public do chính api-center dựng từ bảng derp_servers (Neon), chỉ gồm node đang
  # enabled & !paused & !embedded. CI không cần credential DB; api-center là lớp
  # truy cập duy nhất. Mỗi Node -> 1 target deploy: Name = REPORTER_NAME,
  # HostName = DERP_HOSTNAME, và số N trong Name để tra secret VPN{N}_*.
  # URL override được qua repo variable DERPMAP_URL.
  discover:
    name: Khám phá relay node qua API
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    outputs:
      matrix: ${{ steps.q.outputs.matrix }}
      count: ${{ steps.q.outputs.count }}
    steps:
      - name: Fetch /derpmap.json và dựng matrix
        id: q
        env:
          DERPMAP_URL: ${{ vars.DERPMAP_URL || 'https://vpn2.hangocthanh.io.vn/derpmap.json' }}
        run: |
          echo "Đọc danh sách relay từ: $DERPMAP_URL"
          body=$(curl -fsS --max-time 20 "$DERPMAP_URL") || {
            echo "::error::Không fetch được $DERPMAP_URL — kiểm tra api-center + route Caddy /derpmap.json"
            exit 1
          }
          # Regions.*.Nodes[] -> {name: Name, hostname: HostName, num: chữ số trong Name}.
          # Region embedded (vpn2) đã bị api-center loại khỏi /derpmap.json.
          matrix=$(echo "$body" | jq -c '
            { include: [ .Regions[]?.Nodes[]?
                | { name: .Name, hostname: .HostName,
                    num: (.Name | gsub("[^0-9]";"")) }
                | select(.num != "") ] }')
          count=$(echo "$matrix" | jq '.include | length')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Phát hiện $count relay node."
          echo "$matrix" | jq .

  # ── 5a. Deploy vpn2 (node control/embedded — không nằm trong derp_servers) ─────
  deploy-vpn2:
    name: Deploy derp-relay → vpn2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPN2_HOST }}
          username: ${{ secrets.VPN2_USER }}
          key: ${{ secrets.VPN2_SSH_KEY }}
          script: |
            cd /opt/tailscale-remote/deploy/vpn2
            docker compose pull derp-relay
            docker compose up -d --no-deps derp-relay
            echo "derp-relay vpn2 OK"

  # ── 5b. Deploy các relay node theo matrix sinh từ DB ──────────────────────────
  # Secret SSH tra động theo quy ước VPN{num}_HOST/_USER/_SSH_KEY. Node mới thêm
  # vào DB chỉ cần khai 3 secret tương ứng là tự được deploy — không sửa workflow.
  deploy-relay:
    name: Deploy derp-relay → ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [build, discover]
    if: github.ref == 'refs/heads/main' && needs.discover.outputs.count != '0'
    continue-on-error: true
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Kiểm tra có secret SSH cho ${{ matrix.name }}
        env:
          H: ${{ secrets[format('VPN{0}_HOST', matrix.num)] }}
        run: |
          if [ -z "$H" ]; then
            echo "::warning::Không có secret VPN${{ matrix.num }}_HOST cho node ${{ matrix.name }} (${{ matrix.hostname }}) — bỏ qua deploy. Thêm secret để tự deploy."
            exit 1
          fi
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets[format('VPN{0}_HOST', matrix.num)] }}
          username: ${{ secrets[format('VPN{0}_USER', matrix.num)] }}
          key: ${{ secrets[format('VPN{0}_SSH_KEY', matrix.num)] }}
          script: |
            cd /opt/tailscale-remote/deploy/relay
            DERP_HOSTNAME=${{ matrix.hostname }} REPORTER_NAME=${{ matrix.name }} \
            docker compose pull && docker compose up -d --force-recreate
            echo "derp-relay ${{ matrix.name }} OK"
