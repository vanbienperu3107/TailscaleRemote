name: 'Module: client-agent'

on:
  push:
    branches: [main]
    paths:
      - 'modules/client-agent/**'
      - 'contracts/**'
  pull_request:
    paths:
      - 'modules/client-agent/**'
      - 'contracts/**'
  workflow_dispatch:

env:
  MODULE: modules/client-agent

jobs:
  # ── 1. Build + vet ──────────────────────────────────────────────────────────
  build:
    name: Build tailscale-agent
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: go vet
        working-directory: ${{ env.MODULE }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

      - name: Build
        working-directory: ${{ env.MODULE }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o tailscale-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/tailscale-agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.MODULE }}/tailscale-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  # ── 2. Unit tests ────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go test
        working-directory: ${{ env.MODULE }}
        run: go test ./...

  # ── 3. Contract check ─────────────────────────────────────────────────────────
  contract-check:
    name: Check API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Warn on api-center contract change
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^contracts/api-center"; then
            echo "::warning::api-center contract changed — verify client-agent /api/client/config fields match"
          fi
      - name: Verify required config fields present
        run: |
          AGENT="${{ env.MODULE }}/internal/config/api.go"
          for field in LanRoutes MetricsInterval ProxyRank GostListenPort GostItopPort; do
            grep -q "$field" "$AGENT" || { echo "::error::missing $field in config/api.go"; exit 1; }
          done
          echo "Config fields OK"

  # ── 4. Release (main only) ───────────────────────────────────────────────────
  release:
    name: Upload Windows exe to release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-agent-windows-amd64
          path: dist/
      - name: Upload to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git tag --sort=-version:refname | head -1)
          if [ -z "$TAG" ]; then
            echo "No release tag found — skipping upload"
            exit 0
          fi
          gh release upload "$TAG" dist/tailscale-agent-windows-amd64.exe \
            --clobber || true
